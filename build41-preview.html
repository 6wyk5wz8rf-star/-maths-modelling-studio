<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maths Modelling Studio · Build 41 Preview</title>
<style>
:root{--ink:#213f4c;--muted:#74878e;--line:#dce7e3;--paper:#fff;--wash:#f3f7f5;--sage:#dfece5;--blue:#dfeaf1}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#eef3f1;font-family:"Avenir Next",system-ui,sans-serif;color:var(--ink)}
.shell{height:100%;display:grid;grid-template-rows:auto 1fr;padding:10px;gap:8px}
.lens{display:grid;grid-template-columns:auto minmax(180px,1fr) auto auto;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 10px 28px rgba(31,61,73,.07);z-index:5}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--sage),var(--blue));font-size:18px}
.question{width:100%;min-height:42px;border:0;outline:0;background:transparent;color:var(--ink);font:650 clamp(16px,2vw,25px)/1.25 "Avenir Next",system-ui,sans-serif;padding:5px 7px}
.question::placeholder{color:#97a5aa}.pill{border:1px solid var(--line);background:#fff;color:#536a73;border-radius:999px;min-height:38px;padding:7px 12px;font:800 11px system-ui;white-space:nowrap}.pill:hover{background:var(--wash)}.pill.active{background:#294d5c;color:#fff;border-color:#294d5c}
.frameWrap{min-height:0;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 42px rgba(31,61,73,.08)}
iframe{width:100%;height:100%;border:0;background:#fff}
.focus .shell{padding:0;grid-template-rows:0 1fr;gap:0}.focus .lens{display:none}.focus .frameWrap{border:0;border-radius:0;box-shadow:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#213f4c;color:#fff;border-radius:999px;padding:10px 14px;font:800 11px system-ui;transition:.18s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.shell{padding:6px}.lens{grid-template-columns:auto 1fr auto}.lens .secondary{display:none}.mark{width:34px;height:34px}.pill{padding-inline:10px}.question{font-size:15px}}
</style>
</head>
<body>
<div class="shell">
  <header class="lens" aria-label="Question Lens">
    <div class="mark" aria-hidden="true">◌</div>
    <input id="question" class="question" maxlength="180" placeholder="What do you want children to notice?" aria-label="Lesson question">
    <button id="clear" class="pill secondary" type="button">Clear</button>
    <button id="focus" class="pill" type="button">Focus</button>
  </header>
  <main class="frameWrap"><iframe id="studio" src="index.html" title="Maths Modelling Studio"></iframe></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const key='mms-build41-question';
  const input=document.getElementById('question');
  const frame=document.getElementById('studio');
  const focus=document.getElementById('focus');
  const clear=document.getElementById('clear');
  const toast=document.getElementById('toast');
  input.value=localStorage.getItem(key)||'';
  let timer;
  const say=t=>{toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1300)};
  const sync=()=>{
    localStorage.setItem(key,input.value.trim());
    try{
      const d=frame.contentDocument;
      if(!d)return;
      let card=d.getElementById('build41QuestionCard');
      if(!card){
        const style=d.createElement('style');
        style.id='build41QuestionStyle';
        style.textContent=`#build41QuestionCard{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:14;width:min(760px,82%);padding:10px 16px;border:1px solid #dbe6e2;border-radius:16px;background:rgba(255,255,255,.95);box-shadow:0 9px 24px rgba(31,61,73,.07);font:650 clamp(17px,2.2vw,30px)/1.25 "Avenir Next",system-ui,sans-serif;color:#294b59;text-align:center;pointer-events:none}.presentation #build41QuestionCard{top:18px;width:min(980px,76%);font-size:clamp(28px,3.5vw,54px);padding:14px 22px}.presentation.displayControlsHidden #build41QuestionCard{top:14px}@media(max-width:720px){#build41QuestionCard{top:8px;width:88%;font-size:15px;padding:8px 11px}}`;
        d.head.appendChild(style);
        card=d.createElement('div');card.id='build41QuestionCard';card.setAttribute('aria-live','polite');d.body.appendChild(card);
      }
      card.textContent=input.value.trim();
      card.style.display=input.value.trim()?'block':'none';
    }catch(e){}
  };
  input.addEventListener('input',sync);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur();say('Question set');}});
  clear.addEventListener('click',()=>{input.value='';sync();input.focus();say('Question cleared')});
  focus.addEventListener('click',()=>{document.body.classList.toggle('focus');const on=document.body.classList.contains('focus');focus.classList.toggle('active',on);focus.textContent=on?'Exit focus':'Focus';if(on)say('Focus view');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('focus'))focus.click();});
  frame.addEventListener('load',sync);
})();
</script>
</body>
</html>
