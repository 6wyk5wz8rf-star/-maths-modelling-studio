<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maths Modelling Studio · Build 42 Thinking Engine</title>
<style>
:root{
  --ink:#213f4c;--text:#4c626b;--muted:#7a8b91;--line:#dce7e3;
  --paper:#fff;--wash:#f4f7f6;--sage:#e4efe9;--blue:#e5eef4;--gold:#f3ead8;
  --shadow:0 12px 34px rgba(31,61,73,.08)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#edf3f0;font-family:"Avenir Next","SF Pro Text",system-ui,sans-serif;color:var(--ink)}
button,input{font:inherit}
button{cursor:pointer}
.shell{height:100%;display:grid;grid-template-rows:auto 1fr;padding:10px;gap:8px}
.lens{
  display:grid;grid-template-columns:auto minmax(180px,1fr) auto auto auto;
  align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);
  border-radius:18px;background:rgba(255,255,255,.97);box-shadow:var(--shadow);z-index:6
}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--sage),var(--blue));font-size:18px}
.question{width:100%;min-height:42px;border:0;outline:0;background:transparent;color:var(--ink);font:650 clamp(16px,2vw,24px)/1.25 "Avenir Next",system-ui,sans-serif;padding:5px 7px}
.question::placeholder{color:#97a5aa}
.pill{border:1px solid var(--line);background:#fff;color:#536a73;border-radius:999px;min-height:38px;padding:7px 12px;font:800 11px system-ui;white-space:nowrap}
.pill:hover{background:var(--wash)}
.pill.active{background:#294d5c;color:#fff;border-color:#294d5c}
.frameWrap{min-height:0;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 18px 42px rgba(31,61,73,.08)}
iframe{width:100%;height:100%;border:0;background:#fff}
.thinkingPanel{
  position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(920px,calc(100% - 36px));padding:10px;border:1px solid rgba(53,86,99,.14);
  border-radius:18px;background:rgba(252,253,252,.96);box-shadow:0 14px 34px rgba(31,61,73,.12);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:7;display:grid;gap:8px
}
.thinkingTop{display:flex;align-items:center;gap:8px}
.engineLabel{font:900 9px system-ui;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.modelBadge{min-height:28px;padding:5px 9px;border-radius:999px;background:var(--wash);color:#60747d;font:800 10px system-ui}
.thinkingTop .spacer{flex:1}
.tiny{border:0;background:transparent;color:#647780;border-radius:9px;min-height:30px;padding:5px 8px;font:850 10px system-ui}
.tiny:hover{background:var(--wash)}
.promptRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.prompt{
  position:relative;border:1px solid var(--line);border-radius:13px;background:#fff;color:#35535f;
  min-height:58px;padding:10px 34px 10px 11px;text-align:left;font:750 12px/1.35 system-ui;
  transition:.14s
}
.prompt:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(31,61,73,.07)}
.prompt.selected{border-color:#72948a;background:#edf5f1;box-shadow:inset 3px 0 #72948a}
.prompt .pin{position:absolute;right:7px;top:7px;width:24px;height:24px;border:0;border-radius:8px;background:transparent;color:#91a0a5;font-size:13px;padding:0}
.prompt .pin:hover{background:#f1f5f3}
.prompt.selected .pin{color:#4e7467}
.focus .shell{padding:0;grid-template-rows:0 1fr;gap:0}
.focus .lens{display:none}
.focus .frameWrap{border:0;border-radius:0;box-shadow:none}
.focus .thinkingPanel{bottom:max(14px,env(safe-area-inset-bottom));width:min(1040px,calc(100% - 28px))}
.focus.promptsHidden .thinkingPanel{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#213f4c;color:#fff;border-radius:999px;padding:10px 14px;font:800 11px system-ui;transition:.18s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){
  .shell{padding:6px}.lens{grid-template-columns:auto 1fr auto}.lens .secondary{display:none}
  .mark{width:34px;height:34px}.pill{padding-inline:10px}.question{font-size:15px}
  .thinkingPanel{width:calc(100% - 18px);bottom:9px}
  .promptRow{grid-template-columns:1fr}.prompt{min-height:46px}
  .promptRow .prompt:nth-child(n+3){display:none}
}
</style>
</head>
<body>
<div class="shell">
  <header class="lens" aria-label="Lesson lens">
    <div class="mark" aria-hidden="true">◌</div>
    <input id="question" class="question" maxlength="180" placeholder="What do you want children to notice?" aria-label="Lesson question">
    <button id="clear" class="pill secondary" type="button">Clear</button>
    <button id="shuffleTop" class="pill secondary" type="button">New prompts</button>
    <button id="focus" class="pill" type="button">Focus</button>
  </header>

  <main class="frameWrap">
    <iframe id="studio" src="index.html" title="Maths Modelling Studio"></iframe>

    <section class="thinkingPanel" aria-label="Mathematical Thinking Engine">
      <div class="thinkingTop">
        <span class="engineLabel">Thinking Engine</span>
        <span id="modelBadge" class="modelBadge">Reading the model…</span>
        <span class="spacer"></span>
        <button id="hidePrompts" class="tiny" type="button">Hide</button>
        <button id="shuffle" class="tiny" type="button">Shuffle ↻</button>
      </div>
      <div id="promptRow" class="promptRow"></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
  const questionKey='mms-build42-question';
  const pinnedKey='mms-build42-pinned';
  const input=document.getElementById('question');
  const frame=document.getElementById('studio');
  const focus=document.getElementById('focus');
  const clear=document.getElementById('clear');
  const toast=document.getElementById('toast');
  const row=document.getElementById('promptRow');
  const badge=document.getElementById('modelBadge');
  const shuffle=document.getElementById('shuffle');
  const shuffleTop=document.getElementById('shuffleTop');
  const hidePrompts=document.getElementById('hidePrompts');

  input.value=localStorage.getItem(questionKey)||'';
  let timer, currentModel='home', currentTitle='Start', observer, pinned=JSON.parse(localStorage.getItem(pinnedKey)||'[]');

  const banks={
    universal:[
      'What do you notice first?',
      'What changed, and what stayed the same?',
      'How could you convince someone?',
      'Can you show the same idea another way?',
      'What would happen if one value changed?',
      'Which part of the model matters most?',
      'What is always true here?',
      'Can you create an example that breaks the pattern?',
      'What is the smallest change you could make?',
      'What question does this model answer?'
    ],
    number:[
      'Where can you see the value in the model?',
      'How is the quantity composed?',
      'What would ten times as much look like?',
      'Which representation makes the structure clearest?',
      'Can you partition the number differently?',
      'What is the relationship between adjacent places?'
    ],
    fraction:[
      'How do you know the parts are equal?',
      'Where is the whole?',
      'Which fractions are equivalent here?',
      'What changes when the denominator changes?',
      'Can the same amount be partitioned another way?',
      'How would you prove two fractions are equal?'
    ],
    multiplication:[
      'Where can you see the factors?',
      'How does the model show the product?',
      'What could be partitioned to make this easier?',
      'Which partial products are visible?',
      'How would the model change if the factors swapped?',
      'What distributive structure can you see?'
    ],
    measure:[
      'Which measurements are fixed?',
      'What changes while the area stays the same?',
      'How could you measure this without counting every unit?',
      'Which property is being preserved?',
      'What information is unnecessary?',
      'Can two different shapes have the same measure?'
    ],
    geometry:[
      'Which properties define this shape?',
      'What changes under a rotation or reflection?',
      'Which features are essential, and which are accidental?',
      'How could you classify this in two different ways?',
      'Where can you see symmetry?',
      'What would make this no longer belong to the group?'
    ],
    method:[
      'Why does this step work?',
      'Which place value is active now?',
      'Where has regrouping happened?',
      'Can you estimate the answer before finishing?',
      'Which error would be easiest to make here?',
      'How could a model explain this written step?'
    ],
    coordinates:[
      'How can you describe the movement precisely?',
      'Which coordinate changes first?',
      'What stays invariant under this movement?',
      'Can you predict the new position?',
      'How could you reach the same point another way?',
      'What pattern do the coordinates make?'
    ]
  };

  const categories={
    placeValue:'number',numberLine:'number',baseTen:'number',bar:'number',
    fractions:'fraction',array:'multiplication',grid:'multiplication',
    column:'method',multiplication:'method',partitionMultiplication:'multiplication',division:'method',
    areaPerimeter:'measure',clock:'measure',
    shapes:'geometry',angle:'geometry',coordinates:'coordinates',
    board:'universal',home:'universal'
  };

  const say=t=>{toast.textContent=t;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1300)};
  const shuffleArray=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

  function detectModel(){
    try{
      const d=frame.contentDocument;
      const body=d.body;
      const model=body?.dataset?.model || d.querySelector('.modelBtn.active')?.dataset?.model || 'home';
      const title=d.querySelector('.stageTitle')?.textContent?.trim() || model;
      if(model!==currentModel || title!==currentTitle){
        currentModel=model; currentTitle=title; renderPrompts();
      }
      installQuestionCard();
    }catch(e){}
  }

  function bank(){
    const category=categories[currentModel]||'universal';
    return [...new Set([...(banks[category]||[]),...banks.universal])];
  }

  function renderPrompts(){
    badge.textContent=currentTitle||currentModel;
    const pool=bank();
    const pinnedForModel=pinned.filter(x=>x.model===currentModel).map(x=>x.text);
    const rest=shuffleArray(pool.filter(x=>!pinnedForModel.includes(x)));
    const prompts=[...pinnedForModel,...rest].slice(0,3);
    row.innerHTML='';
    prompts.forEach(text=>{
      const selected=pinnedForModel.includes(text);
      const b=document.createElement('button');
      b.className='prompt'+(selected?' selected':'');
      b.type='button';
      b.innerHTML=`<span>${text}</span><button class="pin" type="button" aria-label="${selected?'Unpin':'Pin'} prompt">${selected?'◆':'◇'}</button>`;
      b.addEventListener('click',e=>{
        if(e.target.classList.contains('pin')) return;
        input.value=text; syncQuestion(); say('Prompt moved to lesson question');
      });
      b.querySelector('.pin').addEventListener('click',e=>{
        e.stopPropagation();
        const index=pinned.findIndex(x=>x.model===currentModel&&x.text===text);
        if(index>=0){pinned.splice(index,1);say('Prompt unpinned')}
        else{pinned.push({model:currentModel,text});say('Prompt pinned')}
        localStorage.setItem(pinnedKey,JSON.stringify(pinned));
        renderPrompts();
      });
      row.appendChild(b);
    });
  }

  function installQuestionCard(){
    try{
      const d=frame.contentDocument;
      if(!d)return;
      let style=d.getElementById('build42QuestionStyle');
      if(!style){
        style=d.createElement('style');style.id='build42QuestionStyle';
        style.textContent=`#build42QuestionCard{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:14;width:min(780px,82%);padding:10px 16px;border:1px solid #dbe6e2;border-radius:16px;background:rgba(255,255,255,.95);box-shadow:0 9px 24px rgba(31,61,73,.07);font:650 clamp(17px,2.2vw,30px)/1.25 "Avenir Next",system-ui,sans-serif;color:#294b59;text-align:center;pointer-events:none}.presentation #build42QuestionCard{top:18px;width:min(980px,76%);font-size:clamp(28px,3.5vw,54px);padding:14px 22px}.presentation.displayControlsHidden #build42QuestionCard{top:14px}@media(max-width:720px){#build42QuestionCard{top:8px;width:88%;font-size:15px;padding:8px 11px}}`;
        d.head.appendChild(style);
      }
      let card=d.getElementById('build42QuestionCard');
      if(!card){card=d.createElement('div');card.id='build42QuestionCard';card.setAttribute('aria-live','polite');d.body.appendChild(card)}
      card.textContent=input.value.trim();
      card.style.display=input.value.trim()?'block':'none';
    }catch(e){}
  }

  function syncQuestion(){
    localStorage.setItem(questionKey,input.value.trim());
    installQuestionCard();
  }

  input.addEventListener('input',syncQuestion);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur();say('Question set')}});
  clear.addEventListener('click',()=>{input.value='';syncQuestion();input.focus();say('Question cleared')});
  const reshuffle=()=>{renderPrompts();say('New prompts')};
  shuffle.addEventListener('click',reshuffle);shuffleTop.addEventListener('click',reshuffle);

  focus.addEventListener('click',()=>{
    document.body.classList.toggle('focus');
    const on=document.body.classList.contains('focus');
    focus.classList.toggle('active',on);
    focus.textContent=on?'Exit focus':'Focus';
    hidePrompts.textContent='Hide';
    document.body.classList.remove('promptsHidden');
    say(on?'Focus view':'Studio view');
  });

  hidePrompts.addEventListener('click',()=>{
    document.body.classList.toggle('promptsHidden');
    const hidden=document.body.classList.contains('promptsHidden');
    hidePrompts.textContent=hidden?'Show':'Hide';
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&document.body.classList.contains('focus'))focus.click();
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();input.focus()}
  });

  frame.addEventListener('load',()=>{
    detectModel();
    try{
      observer=new MutationObserver(detectModel);
      observer.observe(frame.contentDocument.body,{attributes:true,subtree:true,childList:true,attributeFilter:['class','data-model']});
    }catch(e){}
    setInterval(detectModel,900);
  });

  renderPrompts();
})();
</script>
</body>
</html>
